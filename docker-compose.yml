services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webhook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/init-env.sh first}
      POSTGRES_DB: ${POSTGRES_DB:-webhook}
    ports:
      # Bound to loopback only: never reachable from other machines.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The server itself, built from the Dockerfile. Opt-in:
  #   docker compose --profile app up -d --build
  # It is published on 127.0.0.1 only and speaks plain HTTP; for anything
  # reachable from other machines, put a TLS-terminating reverse proxy in
  # front (or set TLS_CERT_FILE/TLS_KEY_FILE and mount the files).
  server:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
      # Inside the container the server must listen on all interfaces; the
      # port is published to the host's loopback only (below).
      ALLOW_INSECURE_HTTP: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
